services:
  - type: web
    name: apex-oes-portal
    env: python
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: gunicorn --workers 2 --threads 2 --timeout 120 "app:create_app()"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
